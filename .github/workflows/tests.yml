name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Factor language tests
        run: python tests/test_dsl.py
      - name: LLM client tests
        run: python tests/test_llm.py
      - name: India pipeline tests
        run: python tests/test_india.py
      - name: Phase 4 tests
        run: python tests/test_phase4.py
      - name: Phase 5 tests
        run: python tests/test_phase5.py
      - name: Phase 6 tests
        run: python tests/test_phase6.py
      - name: Phase 7 tests
        run: python tests/test_phase7.py
      - name: Phase 8 app tests
        run: python tests/test_phase8.py
